<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>UPI Link Test</title>
  <style>
    body {
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      font-family:system-ui,-apple-system,Segoe UI,sans-serif;
      background:#f5f6f8;
      padding:20px;
      color:#17191f;
    }
    .card {
      width:min(100%,420px);
      background:#fff;
      border:1px solid #e5e7eb;
      border-radius:20px;
      padding:24px;
      box-shadow:0 14px 40px rgba(0,0,0,.08);
      text-align:center;
    }
    h1 { margin:0 0 8px; font-size:24px; }
    p { color:#6b7280; line-height:1.5; }
    .pay {
      display:block;
      margin-top:20px;
      padding:16px 18px;
      border-radius:14px;
      background:#111827;
      color:#fff;
      text-decoration:none;
      font-size:17px;
      font-weight:800;
    }
    code {
      display:block;
      margin-top:18px;
      font-size:11px;
      color:#7b8190;
      word-break:break-all;
      text-align:left;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>UPI Link Test</h1>
    <p>This button is a plain HTML link using the exact same payment URI as the working QR.</p>

    <a class="pay" href="upi://pay?pa=paytm.s3hc53w@pty&pn=Paytm&tn=Verified%20Paytm%20Merchant&am=49.00&cu=INR">Pay ₹49</a>

    <code>upi://pay?pa=paytm.s3hc53w@pty&pn=Paytm&tn=Verified%20Paytm%20Merchant&am=49.00&cu=INR</code>
  </main>
</body>
</html>
